services:
  backend:
    # IMAGE_TAG env var selects source:
    # - set (e.g. IMAGE_TAG=latest) → pull from GHCR (production deploy)
    # - unset → build from local Dockerfile (dev/CI)
    image: ${REGISTRY:-ghcr.io/ndanhd}/book-app-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5001"
      FLASK_DEBUG: "false"
      # books.json written to named volume so data survives restarts
      DATA_FILE: "/data/books.json"
      CORS_ORIGINS: "http://localhost,http://nginx"
    volumes:
      - book_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ${REGISTRY:-ghcr.io/ndanhd}/book-app-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api is handled by nginx reverse proxy — no CORS, no port leaking
        VITE_API_URL: "/api"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  # Nginx is the sidecar: single entry point, hides internal service topology
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: book-app_network
    driver: bridge

volumes:
  book_data:
