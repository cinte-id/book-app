# Orchestration: jalankan frontend & backend dalam satu perintah
# Usage: docker compose up --build
version: '3.8'

services:
  # Frontend: React + Nginx (port 80)
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:5001
    depends_on:
      - backend

  # Backend: Python Flask (port 5001)
  backend:
    build: ./backend
    ports:
      - "5001:5001"
