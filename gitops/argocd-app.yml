apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-app
  namespace: argocd
  # Cascade delete: removing this Application also removes all K8s resources it manages
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ndanHD/book-app-devops-tes.git
    targetRevision: HEAD
    # ArgoCD watches the k8s/ directory — any commit here triggers a sync
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: book-app

  syncPolicy:
    # Automatic sync: ArgoCD applies changes as soon as Git diverges from cluster state.
    # Self-heal: reverts any manual kubectl edits so Git stays the single source of truth.
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # revert out-of-band cluster changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
