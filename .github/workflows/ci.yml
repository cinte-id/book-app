name: DevOps CI Pipeline

on:
  push:
    branches: [ main, '*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Code Linting & Syntax Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Code with Flake8
      run: |
        # Stop build jika ada Python syntax errors atau undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-status 0 jika hanya isu style (mencegah pipeline gagal karena spasi)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build-verify:
    name: Multi-Stage Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: book-app-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max