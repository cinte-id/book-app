name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python (backend)
        run: ruff check backend/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint TypeScript (frontend)
        run: npm run lint
        working-directory: frontend

  # ── Stage 2: Build ─────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: book-app-backend:ci
          # GHA cache so repeated builds are fast
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: book-app-frontend:ci
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          load: true

  # ── Stage 3: Test ──────────────────────────────────────────────────────────
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (for test)
        run: docker build -t book-app-backend:ci ./backend

      - name: Start backend container
        run: |
          docker run -d \
            --name backend-test \
            -p 5001:5001 \
            -e DATA_FILE=/tmp/books.json \
            -e FLASK_DEBUG=false \
            book-app-backend:ci

      - name: Wait for backend to be healthy
        run: bash scripts/healthcheck.sh http://localhost:5001/api/test 30 2

      - name: Test /api/test endpoint
        run: curl -sf http://localhost:5001/api/test | grep -q "CORS"

      - name: Test /api/books returns JSON array
        run: curl -sf http://localhost:5001/api/books | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d, list)"

      - name: Test POST /api/books creates a book
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:5001/api/books \
            -H "Content-Type: application/json" \
            -d '{"title":"Test Book","author":"Test Author","status":"unread"}')
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['title']=='Test Book'"

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-test

      - name: Cleanup
        if: always()
        run: docker rm -f backend-test || true

  # ── Stage 4: Vulnerability Scan (Trivy) ───────────────────────────────────
  scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scan
        run: docker build -t book-app-backend:scan ./backend

      - name: Build frontend image for scan
        run: docker build -t book-app-frontend:scan --build-arg VITE_API_URL=/api ./frontend

      # Fail on CRITICAL vulns; HIGH reported but not blocking so builds aren't
      # killed by upstream base image issues outside our control
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: book-app-backend:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: book-app-frontend:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # Upload SARIF report so vulnerabilities appear in GitHub Security tab
      - name: Scan backend (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: book-app-backend:scan
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ── Stage 5: Push to GHCR (main branch only) ──────────────────────────────
  push:
    name: Push Images to GHCR
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker registry requires lowercase — github.repository_owner may have uppercase
      - name: Lowercase repository owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV

      # GITHUB_TOKEN is auto-provided — no manual secret setup needed for GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/book-app-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/book-app-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/book-app-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/book-app-frontend:${{ github.sha }}
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
