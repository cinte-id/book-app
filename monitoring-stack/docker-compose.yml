networks:
  monitoring:
    driver: bridge
  # Sambungkan ke network tempat frontend & backend kamu berjalan
  # supaya blackbox-exporter bisa probe lewat nama service (bukan public URL)
  app-network:
    external: true
    name: app-network   # ganti sesuai nama network compose/swarm app kamu

volumes:
  prometheus_data:
  grafana_data:

services:

  # ----------------------------------------------------------------
  # PROMETHEUS - core scraper & TSDB
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ----------------------------------------------------------------
  # GRAFANA - visualisasi & dashboard
  # ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=8ismillah   # ganti sebelum deploy!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

  # ----------------------------------------------------------------
  # NODE EXPORTER - metrik host/server (CPU, RAM, disk, network)
  # ----------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ----------------------------------------------------------------
  # CADVISOR - metrik per container (CPU, memory, network, restart)
  # Ini yang paling penting untuk kamu: tanpa ubah source code,
  # langsung dapat resource usage React & Flask container masing2.
  # ----------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    networks:
      - monitoring

  # ----------------------------------------------------------------
  # BLACKBOX EXPORTER - probe HTTP frontend & backend dari luar
  # (up/down, response time, status code, SSL expiry) - zero code change
  # ----------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring
      - app-network   # supaya bisa probe service internal langsung

