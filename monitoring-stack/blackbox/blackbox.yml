modules:

  # Probe HTTP standar - dipakai untuk cek frontend & backend up/down + latency
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 202, 204, 301, 302]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false

  # Kalau perlu cek endpoint yang butuh POST (misal login health-check)
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      valid_status_codes: [200, 201]

  # Khusus cek umur SSL certificate (alert sebelum expired)
  ssl_expiry:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 301, 302, 401, 403]
      fail_if_ssl: false
      fail_if_not_ssl: true

  # Cek DNS resolution time (opsional, kalau mau pisah dari HTTP probe)
  dns_resolve:
    prober: dns
    timeout: 5s
    dns:
      query_name: "app.digitalteknodata.com"
      query_type: "A"
