upstream backend_upstream {
    server backend:5001;
    # Tambah server lain di sini kalau mau load balancing:
    # server backend2:3000;
}

server {
    listen 80;
    server_name api.digitalteknodata.com;

    server_tokens off;

    # ── Batas ukuran request body (sesuaikan kebutuhan) ───────────
    client_max_body_size 20M;

    # ── Proxy ke backend ──────────────────────────────────────────
    location / {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── Health check endpoint (tidak di-log) ─────────────────────
    location /health {
        proxy_pass         http://backend_upstream/health;
        access_log         off;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/backend_access.log;
    error_log  /var/log/nginx/backend_error.log;
}
