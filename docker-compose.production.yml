# Production override — use with:
# IMAGE_TAG=latest SECRET_KEY=<value> docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:
  backend:
    env_file:
      - envs/production.env
    environment:
      # Runtime override — takes precedence over env_file
      SECRET_KEY: ${SECRET_KEY}
    # Production: tighter resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  frontend:
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  nginx:
    ports:
      - "80:80"
