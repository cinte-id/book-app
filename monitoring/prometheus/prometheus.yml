global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
rule_files:
  - "alert.rules.yml"


scrape_configs:
  # Prometheus scrape dirinya sendiri
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics sistem EC2 via Node Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Metrics aplikasi Flask backend
  - job_name: "flask-backend"
    static_configs:
      - targets: ["book-app-backend:5001"]
    metrics_path: "/metrics"