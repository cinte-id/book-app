global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Blackbox exporter probes HTTP endpoints and exposes probe_success,
  # probe_duration_seconds, probe_http_status_code, etc.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/api/test
          - http://nginx/api/books
    relabel_configs:
      # Route each target through blackbox-exporter
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # cAdvisor exposes per-container resource metrics
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
