groups:
  - name: book-app
    interval: 30s
    rules:
      - alert: BackendDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Book App endpoint is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighResponseTime
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time on {{ $labels.instance }}"
          description: "Response time is {{ $value | humanizeDuration }} (threshold: 2s)."

      - alert: HighContainerMemory
        expr: |
          container_memory_usage_bytes{name=~"book-app.*"}
          / container_spec_memory_limit_bytes{name=~"book-app.*"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory > 85%"
          description: "Memory usage is at {{ $value | humanizePercentage }} of the limit."
